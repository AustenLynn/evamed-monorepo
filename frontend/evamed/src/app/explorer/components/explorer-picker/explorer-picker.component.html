<header class="picker__bar">
  <div class="picker__heading">
    <h1 class="picker__title" mat-dialog-title>{{ title }}</h1>
    <p class="picker__context">
      <span *ngIf="context.section">{{ context.section }} · </span>{{ context.system }}
    </p>
  </div>
  <button mat-icon-button type="button" aria-label="Cerrar el explorador sin agregar" (click)="close()">
    <mat-icon>close</mat-icon>
  </button>
</header>

<div #body class="picker__body">
  <p *ngIf="step.kind === 'loading'" role="status" class="picker__status">Cargando material…</p>

  <nav *ngIf="step.kind !== 'list' && step.kind !== 'loading'" class="picker__crumbs" aria-label="Ruta">
    <button mat-button type="button" (click)="backToList()">
      <mat-icon aria-hidden="true">arrow_back</mat-icon> Materiales
    </button>
  </nav>

  <p *ngIf="failedNames.length" role="alert" class="picker__failed">
    No se pudo agregar: {{ failedNames.join(', ') }}. Intenta de nuevo.
  </p>

  <!-- Kept alive while a material is open, so the list comes back as it was. -->
  <app-explorer-browser
    [hidden]="step.kind !== 'list'"
    [stage]="stage"
    [query]="query"
    [view]="view"
    [tablePage]="tablePage"
    [openable]="true"
    [selectable]="selectable"
    [selectedIds]="selectedIds"
    (itemOpen)="open($event)"
    (selectToggle)="toggle($event)"
    (queryChange)="onQuery($event)"
    (viewChange)="view = $event"
    (tablePageChange)="tablePage = $event"
  ></app-explorer-browser>

  <app-material-detail
    *ngIf="step.kind === 'detail'"
    [materialId]="$any(step).id"
    [canSelect]="true"
    [inSelection]="selectedIds.has($any(step).id)"
    (selected)="select($event)"
    (selectToggle)="toggle($event)"
  ></app-material-detail>

  <app-material-edit
    *ngIf="step.kind === 'edit'"
    [detail]="$any(step).detail"
    [context]="context"
    [inSelection]="selection.length > 0"
    [saving]="saving"
    (back)="backToDetail($any(step).detail)"
    (cancelled)="cancelEdit($any(step).detail)"
    (changeMaterial)="backToList()"
    (save)="add($event)"
  ></app-material-edit>
</div>

<footer *ngIf="selection.length && step.kind !== 'loading'" class="picker__tray">
  <div class="picker__picked">
    <span class="picker__count" role="status">
      {{ selection.length }} {{ selection.length === 1 ? 'material seleccionado' : 'materiales seleccionados' }}
    </span>
    <ul class="picker__chips" aria-label="Materiales seleccionados">
      <li *ngFor="let row of selection; trackBy: trackRow" class="picker__chip">
        <span class="picker__chip-name">{{ row.displayName }}</span>
        <button
          type="button"
          class="picker__chip-remove"
          [attr.aria-label]="'Quitar de la selección: ' + row.displayName"
          (click)="remove(row.material.id)"
        >
          <mat-icon aria-hidden="true">close</mat-icon>
        </button>
      </li>
    </ul>
  </div>
  <button mat-flat-button type="button" class="picker__add" [disabled]="saving" (click)="addSelection()">
    {{ saving ? 'Agregando…' : 'Agregar ' + selection.length + (selection.length === 1 ? ' material' : ' materiales') }}
  </button>
</footer>

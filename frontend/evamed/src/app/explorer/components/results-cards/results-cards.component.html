<div #grid class="results-cards">
  <ng-container *ngFor="let item of items; let index = index; trackBy: trackItem">
    <h3 *ngIf="groupHeading(index) as heading" class="results-cards__group">{{ heading }}</h3>
    <app-result-card
      [item]="item"
      [link]="linkFor ? linkFor(item) : null"
      [openable]="openable"
      [selectable]="selectable"
      [selected]="selectedIds.has(item.id)"
      (itemOpen)="itemOpen.emit(item)"
      (selectToggle)="selectToggle.emit(item)"
    ></app-result-card>
  </ng-container>
  <div *ngFor="let skeleton of skeletons" class="results-cards__skeleton" aria-hidden="true"></div>
</div>

<div #sentinel class="results-cards__sentinel"></div>

<div class="results-cards__status">
  <p role="status" class="results-cards__message">
    <ng-container *ngIf="loading && items.length">Cargando más resultados… · {{ items.length }} de {{ count }}</ng-container>
    <ng-container *ngIf="loading && !items.length">Cargando resultados…</ng-container>
    <ng-container *ngIf="!loading && !hasMore && items.length">No hay más resultados</ng-container>
  </p>

  <div *ngIf="failed" class="results-cards__error" role="alert">
    No se pudieron cargar los resultados.
    <button mat-stroked-button type="button" (click)="retry.emit()">Reintentar</button>
  </div>

  <button
    *ngIf="canLoadMore && items.length"
    mat-stroked-button
    type="button"
    class="results-cards__more"
    (click)="requestMore()"
  >
    Cargar más
  </button>
</div>

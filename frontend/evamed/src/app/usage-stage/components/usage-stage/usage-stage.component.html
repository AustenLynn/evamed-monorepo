<nav class="usage-project"><h2>{{ editor?.state?.project_name || 'Proyecto' }}</h2><button mat-button evAction="tertiary" [disabled]="exitLocked" (click)="go('')">Regresar a proyectos</button></nav>
<nav class="usage-stage-nav" aria-label="Etapas del proyecto">
  <button type="button" [disabled]="navigationLocked" (click)="go('materials-stage')"><img src="assets/images/Etapas/Produccion.png" alt="">Producción</button>
  <button type="button" [disabled]="navigationLocked" (click)="go('construction-stage')"><img src="assets/images/Etapas/Construcción.png" alt="">Construcción</button>
  <span aria-current="step"><img src="assets/images/Etapas/Uso.png" alt="">Uso</span>
  <button type="button" [disabled]="navigationLocked" (click)="go('end-life-stage')"><img src="assets/images/Etapas/fin.png" alt="">Fin de vida</button>
</nav>
<app-usage-editor [projectId]="projectId"></app-usage-editor>
<p *ngIf="navigationError" role="alert" evStatus="error">{{ navigationError }}</p>
<footer class="usage-continue"><app-energy-bar></app-energy-bar><div evActions><button mat-stroked-button evAction="secondary" [disabled]="navigationLocked" (click)="go('construction-stage')">Atrás</button><button mat-flat-button evAction="primary" [disabled]="navigationLocked || editor?.blocked" (click)="go('end-life-stage')">Continuar</button><button mat-button evAction="tertiary" [disabled]="navigationLocked" (click)="go('resultados')">Ir a resultados</button></div></footer>

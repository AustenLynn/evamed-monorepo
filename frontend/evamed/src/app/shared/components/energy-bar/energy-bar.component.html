@if (view$ | async; as view) {
<div class="energy-bar-wrapper">
  <div class="energy-bar-legend">
    <span class="legend-item production">
      <span class="legend-dot"></span>Producción
    </span>
    <span class="legend-item construction">
      <span class="legend-dot"></span>Construcción
    </span>
    <span class="legend-item usage">
      <span class="legend-dot"></span>Uso
    </span>
    <span class="legend-item end-life">
      <span class="legend-dot"></span>Fin de vida
    </span>
  </div>

  <div class="energy-bar-track" [class.empty]="!view.productionPct && !view.constructionPct && !view.usagePct && !view.endLifePct">
    <div
      *ngIf="view.breakdown.production > 0"
      class="segment production"
      [style.width.%]="view.productionPct"
      [matTooltip]="'Producción: ' + format(view.breakdown.production) + ' ' + view.breakdown.unit"
      matTooltipPosition="above">
    </div>
    <div
      *ngIf="view.breakdown.construction > 0"
      class="segment construction"
      [style.width.%]="view.constructionPct"
      [matTooltip]="'Construcción: ' + format(view.breakdown.construction) + ' ' + view.breakdown.unit"
      matTooltipPosition="above">
    </div>
    <div
      *ngIf="view.breakdown.usage > 0"
      class="segment usage"
      [style.width.%]="view.usagePct"
      [matTooltip]="'Uso: ' + format(view.breakdown.usage) + ' ' + view.breakdown.unit"
      matTooltipPosition="above">
    </div>
    <div
      *ngIf="view.breakdown.endLife > 0"
      class="segment end-life"
      [style.width.%]="view.endLifePct"
      [matTooltip]="'Fin de vida: ' + format(view.breakdown.endLife) + ' ' + view.breakdown.unit"
      matTooltipPosition="above">
    </div>
  </div>

  <div class="energy-bar-total">
    Total: <strong>{{ format(view.breakdown.total) }} {{ view.breakdown.unit }}</strong>
  </div>
</div>
}

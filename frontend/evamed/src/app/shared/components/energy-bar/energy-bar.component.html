@if (view$ | async; as view) {
<div class="energy-bar-wrapper">
  <div class="energy-bar-legend">
    <span class="legend-item construction">
      <span class="legend-dot"></span>Construcción
    </span>
    <span class="legend-item usage">
      <span class="legend-dot"></span>Uso
    </span>
    <span class="legend-item end-life">
      <span class="legend-dot"></span>Fin de vida
    </span>
  </div>

  <div class="energy-bar-track" [class.empty]="view.breakdown.total === 0">
    <div
      *ngIf="view.breakdown.construction > 0"
      class="segment construction"
      [style.width.%]="view.constructionPct"
      [matTooltip]="'Construcción: ' + format(view.breakdown.construction)"
      matTooltipPosition="above">
    </div>
    <div
      *ngIf="view.breakdown.usage > 0"
      class="segment usage"
      [style.width.%]="view.usagePct"
      [matTooltip]="'Uso: ' + format(view.breakdown.usage)"
      matTooltipPosition="above">
    </div>
    <div
      *ngIf="view.breakdown.endLife > 0"
      class="segment end-life"
      [style.width.%]="view.endLifePct"
      [matTooltip]="'Fin de vida: ' + format(view.breakdown.endLife)"
      matTooltipPosition="above">
    </div>
  </div>

  <div class="energy-bar-total">
    Total: <strong>{{ format(view.breakdown.total) }}</strong>
  </div>
</div>
}

<button
  *ngIf="!editing; else field"
  type="button"
  class="quantity"
  [matTooltip]="'Editar ' + label"
  [disabled]="disabled"
  [attr.aria-label]="'Editar ' + label + ': ' + (value ?? '') + (unit ? ' ' + unit : '')"
  (click)="start($event)"
  (keydown)="$event.stopPropagation()"
>
  {{ display ?? (value | number: '1.2-2') }}
</button>
<ng-template #field>
  <input
    #input
    class="quantity__input"
    type="text"
    inputmode="decimal"
    autocomplete="off"
    [attr.aria-label]="(label | titlecase) + (unit ? ' en ' + unit : '')"
    [attr.aria-invalid]="error ? 'true' : null"
    [value]="draft"
    (input)="draft = $any($event.target).value"
    (click)="$event.stopPropagation()"
    (mousedown)="$event.stopPropagation()"
    (keydown)="onKey($event)"
    (blur)="commit()"
  />
  <span *ngIf="error" class="quantity__error" role="alert">{{ error }}</span>
</ng-template>

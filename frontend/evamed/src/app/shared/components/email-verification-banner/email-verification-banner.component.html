<div class="verify-banner" *ngIf="visible">
  <span class="verify-banner__text">
    Verifica tu correo electrónico: tus proyectos aparecerán en cuanto lo confirmes.
  </span>
  <span class="verify-banner__actions">
    <button type="button" class="verify-banner__link" (click)="resend()">
      Reenviar correo
    </button>
  </span>
</div>
